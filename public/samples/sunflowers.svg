    <radialGradient id="c" cx="0.4" cy="0.4" r="0.6"><stop offset="0" stop-color="#8a5a1a"/><stop offset="1" stop-color="#2e1a07"/></radialGradient>
    <symbol id="flower" viewBox="-120 -120 240 240">
      <g fill="#f5b90f" stroke="#c77a05" stroke-width="3">
